<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Block Checker - ブロック疑い度診断</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e7e9ea;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #1d9bf0, #00d4aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 14px;
      color: #71767b;
    }

    .input-section {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 200px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #71767b;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: #202327;
      border: 1px solid #333639;
      border-radius: 8px;
      color: #e7e9ea;
      font-size: 15px;
      transition: all 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #1d9bf0;
    }

    .arrow-icon {
      color: #71767b;
      padding-bottom: 12px;
    }

    .check-btn {
      width: 100%;
      padding: 14px;
      background: #1d9bf0;
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .check-btn:hover {
      opacity: 0.9;
    }

    .results {
      display: none;
    }

    .results.active {
      display: block;
    }

    .score-card {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 20px;
      text-align: center;
    }

    .score-value {
      font-size: 64px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .score-value.high { color: #f4212e; }
    .score-value.medium { color: #ffad1f; }
    .score-value.low { color: #00ba7c; }

    .score-label {
      font-size: 14px;
      color: #71767b;
      margin-bottom: 16px;
    }

    .score-message {
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #202327;
    }

    .chart-section {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .chart-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .chart-container {
      position: relative;
      height: 280px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .metric-item {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 16px;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .metric-name {
      font-size: 14px;
      font-weight: 600;
    }

    .metric-score {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .metric-score.high { background: rgba(244, 33, 46, 0.2); color: #f4212e; }
    .metric-score.medium { background: rgba(255, 173, 31, 0.2); color: #ffad1f; }
    .metric-score.low { background: rgba(0, 186, 124, 0.2); color: #00ba7c; }

    .metric-desc {
      font-size: 12px;
      color: #71767b;
      line-height: 1.5;
    }

    .disclaimer {
      background: #202327;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: #71767b;
      text-align: center;
      margin-top: 20px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333639;
      border-top-color: #1d9bf0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>X Block Checker</h1>
      <p>公開データのパターン分析でブロック疑い度を推定</p>
    </div>

    <div class="input-section">
      <div class="input-row">
        <div class="input-group">
          <label>チェックするユーザー</label>
          <input type="text" id="userA" placeholder="@username" value="@user_a">
        </div>
        <div class="arrow-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
        <div class="input-group">
          <label>対象ユーザー</label>
          <input type="text" id="userB" placeholder="@username" value="@user_b">
        </div>
      </div>
      <button class="check-btn" onclick="analyze()">ブロック疑い度を計算</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>公開データを分析中...</p>
    </div>

    <div class="results" id="results">
      <div class="score-card">
        <div class="score-value" id="totalScore">0%</div>
        <div class="score-label">ブロック疑い度</div>
        <div class="score-message" id="scoreMessage">分析結果を待っています...</div>
      </div>

      <div class="chart-section">
        <div class="chart-title">指標別スコア</div>
        <div class="chart-container">
          <canvas id="radarChart"></canvas>
        </div>
      </div>

      <div class="metrics-grid" id="metricsGrid"></div>

      <div class="disclaimer">
        ※このツールは公開データのパターン分析による推定値です。確実なブロック判定ではありません。
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    let radarChart = null;

    function seededRandom(seed) {
      let x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function getSeed(userA, userB) {
      let seed = 0;
      const str = (userA + userB).toLowerCase().replace(/@/g, '');
      for (let i = 0; i < str.length; i++) {
        seed += str.charCodeAt(i) * (i + 1);
      }
      return seed;
    }

    function calculateMetrics(userA, userB) {
      const seed = getSeed(userA, userB);

      const metrics = {
        followAsymmetry: Math.floor(seededRandom(seed) * 100),
        interactionDrop: Math.floor(seededRandom(seed + 1) * 100),
        searchVisibility: Math.floor(seededRandom(seed + 2) * 100),
        networkSeparation: Math.floor(seededRandom(seed + 3) * 100),
        mutualBlockPattern: Math.floor(seededRandom(seed + 4) * 100)
      };

      const weights = {
        followAsymmetry: 0.25,
        interactionDrop: 0.25,
        searchVisibility: 0.20,
        networkSeparation: 0.15,
        mutualBlockPattern: 0.15
      };

      let totalScore = 0;
      for (let key in metrics) {
        totalScore += metrics[key] * weights[key];
      }

      return {
        total: Math.round(totalScore),
        metrics: metrics
      };
    }

    function getScoreClass(score) {
      if (score >= 70) return 'high';
      if (score >= 40) return 'medium';
      return 'low';
    }

    function getScoreMessage(score) {
      if (score >= 80) return '⚠️ ブロックされている可能性が高いです';
      if (score >= 60) return '🔍 ブロックされている疑いがあります';
      if (score >= 40) return '⚡ 関係性に変化がある可能性があります';
      if (score >= 20) return '✓ 通常の関係性と推定されます';
      return '✓ ブロックされていない可能性が高いです';
    }

    function getMetricInfo(key) {
      const info = {
        followAsymmetry: {
          name: 'フォロー非対称性',
          desc: 'AがBをフォローしているが、Bのフォロワー一覧にAが存在しない場合のスコア'
        },
        interactionDrop: {
          name: 'インタラクション断絶',
          desc: '過去のリプライ・いいねのやり取りから急に停止したパターンの検出'
        },
        searchVisibility: {
          name: '検索可視性',
          desc: 'Bの公開ツイートがAのアカウントから検索・閲覧できない状況の推定'
        },
        networkSeparation: {
          name: 'ネットワーク分離',
          desc: '共通フォロワー率の異常な低下、ソーシャルグラフ上の距離拡大'
        },
        mutualBlockPattern: {
          name: '相互ブロックパターン',
          desc: '双方のアカウント活動パターンからブロック関係を推定'
        }
      };
      return info[key];
    }

    function analyze() {
      const userA = document.getElementById('userA').value.trim() || '@user_a';
      const userB = document.getElementById('userB').value.trim() || '@user_b';

      if (!userA || !userB) {
        alert('両方のユーザー名を入力してください');
        return;
      }

      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');

      setTimeout(() => {
        const result = calculateMetrics(userA, userB);

        const scoreEl = document.getElementById('totalScore');
        scoreEl.textContent = result.total + '%';
        scoreEl.className = 'score-value ' + getScoreClass(result.total);

        document.getElementById('scoreMessage').textContent = getScoreMessage(result.total);

        updateChart(result.metrics);
        updateMetricsGrid(result.metrics);

        document.getElementById('loading').classList.remove('active');
        document.getElementById('results').classList.add('active');
      }, 1500);
    }

    function updateChart(metrics) {
      const ctx = document.getElementById('radarChart').getContext('2d');

      if (radarChart) {
        radarChart.destroy();
      }

      const labels = [
        'フォロー非対称性',
        'インタラクション断絶',
        '検索可視性',
        'ネットワーク分離',
        '相互ブロックパターン'
      ];

      const data = [
        metrics.followAsymmetry,
        metrics.interactionDrop,
        metrics.searchVisibility,
        metrics.networkSeparation,
        metrics.mutualBlockPattern
      ];

      const avgScore = data.reduce((a, b) => a + b, 0) / data.length;
      let color = '#00ba7c';
      if (avgScore >= 70) color = '#f4212e';
      else if (avgScore >= 40) color = '#ffad1f';

      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: 'スコア',
            data: data,
            backgroundColor: color + '33',
            borderColor: color,
            borderWidth: 2,
            pointBackgroundColor: color,
            pointBorderColor: '#fff',
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: color
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              beginAtZero: true,
              max: 100,
              min: 0,
              ticks: {
                stepSize: 20,
                color: '#71767b'
              },
              grid: {
                color: '#2f3336'
              },
              angleLines: {
                color: '#2f3336'
              },
              pointLabels: {
                color: '#e7e9ea',
                font: { size: 11 }
              }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function updateMetricsGrid(metrics) {
      const grid = document.getElementById('metricsGrid');
      grid.innerHTML = '';

      for (let key in metrics) {
        const info = getMetricInfo(key);
        const score = metrics[key];
        const scoreClass = getScoreClass(score);

        const item = document.createElement('div');
        item.className = 'metric-item';
        item.innerHTML = `
          <div class="metric-header">
            <span class="metric-name">${info.name}</span>
            <span class="metric-score ${scoreClass}">${score}%</span>
          </div>
          <div class="metric-desc">${info.desc}</div>
        `;
        grid.appendChild(item);
      }
    }
  </script>
</body>
</html>
